[project]
name = "dsa"
version = "0.1.0"
description = "Data structures and algorithms, implemented from scratch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsa"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "prek>=0.5.5",
    "pytest>=8.0",
    "ruff>=0.16.6",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not performance'"
markers = [
    "integration: crosses module boundaries",
    "performance: timing-based and slow; run with `uv run pytest -m performance`"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # bugbear
    "SIM", # simplify
    "C4", # comprehensions
    "RUF", # ruff-specific
    "ANN", # missing annotations
    "D", # docstrings
    "PL", # pylint
    "PTH", # use pathlib
    "TC", # type-checking imports
]
ignore = [
    "D100", # module docstring not required everywhere
    "D104", # package docstring not required
    "D107", # __init__ documented on the class
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]   # docstrings and magic values are noise in tests; annotations still required (mypy strict covers tests too)

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["dsa"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.13"
files = ["dsa", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
